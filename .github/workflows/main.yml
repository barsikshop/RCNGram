name: RCNGram iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check Xcode
        run: xcodebuild -version

      - name: Check Python
        run: python3 --version
